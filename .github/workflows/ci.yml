# Runs on every push to main and on every pull request.
# Nothing here reaches the internet beyond installing packages and the browser:
# tests use the local mock target, and the AI runs in mock mode (e2e/playwright.config.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (package.json "engines") and the one used in development.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit and integration tests, with coverage
        run: npm run test:coverage
      - name: Every manual scenario has an automated test
        run: npm run traceability
      - run: npm run build
      - name: Keep the coverage report
        if: matrix.node == 26
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            shared/coverage
            server/coverage
            client/coverage
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Chromium is used both by the tests and by the app's flow recorder.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results
            e2e/test-results
          retention-days: 14
